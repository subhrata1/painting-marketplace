<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artists — The Brush Collective</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .artists-page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .artists-page h1 {
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 1.5rem;
    }

    .artists-page h1 span {
      color: var(--accent);
    }

    .artists-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .artist-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
    }

    .artist-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, .45);
      border-color: rgba(201, 169, 110, .3);
    }

    .artist-card-cover {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      background: #222;
      transition: transform .5s ease;
    }

    .artist-card:hover .artist-card-cover {
      transform: scale(1.04);
    }

    .artist-card-img-wrap {
      overflow: hidden;
      position: relative;
    }

    .cover-upload-btn {
      position: absolute; bottom: .75rem; right: .75rem;
      background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,255,255,.2);
      padding: .35rem .85rem; border-radius: 6px; cursor: pointer;
      font-size: .78rem; font-family: inherit; display: flex; align-items: center; gap: .35rem;
      transition: background .2s; backdrop-filter: blur(4px); z-index: 2;
    }
    .cover-upload-btn:hover { background: var(--accent); color: #111; border-color: var(--accent); }
    .cover-upload-btn input { display: none; }

    .cover-placeholder {
      width: 100%; aspect-ratio: 4/3; background: var(--surface-2);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--muted); font-size: .85rem; gap: .5rem;
    }

    .artist-card-body {
      padding: 1rem 1.1rem;
    }

    .artist-card-name {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: .3rem;
    }

    .artist-card-bio {
      font-size: .85rem;
      color: var(--muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: .6rem;
    }

    .artist-card-works {
      display: inline-block;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--accent);
      background: rgba(201, 169, 110, .1);
      border: 1px solid rgba(201, 169, 110, .25);
      padding: .2rem .65rem;
      border-radius: 20px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    @media (max-width: 600px) {
      .artists-page {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-brand">The Brush Collective</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <section class="artists-page">
    <h1>Our <span>Artists</span></h1>
    <div class="artists-grid" id="artistsGrid">
      <div class="empty-state">Loading artists...</div>
    </div>
  </section>

  <script src="/js/app.js"></script>
  <script>
    const grid = document.getElementById('artistsGrid');

    async function loadArtists() {
      await loadUser();
      try {
        const data = await api('/auth/public/artists');
        const artists = data.artists || data || [];

        if (!artists.length) {
          grid.innerHTML = '<div class="empty-state">No artists yet</div>';
          return;
        }

        grid.innerHTML = artists.map(artist => {
          const coverImg = artist.profile_image || artist.latest_image || '';
          const name = esc(artist.name || 'Unknown Artist');
          const bio = esc(artist.bio || '');
          const count = artist.painting_count || 0;
          const worksLabel = count === 1 ? '1 work' : count + ' works';
          const isMine = currentUser && currentUser.id === artist.id;

          const uploadBtn = isMine
            ? `<label class="cover-upload-btn" title="Upload photo" onclick="event.stopPropagation()">
                <span>&#128247;</span> ${artist.profile_image ? 'Change Photo' : 'Upload Photo'}
                <input type="file" accept=".jpg,.jpeg,.png,.webp" onchange="uploadPhoto(this, ${artist.id})">
              </label>`
            : '';

          const coverHtml = coverImg
            ? `<img class="artist-card-cover" id="cover-${artist.id}" src="${coverImg}" alt="${name}" loading="lazy">`
            : (isMine
              ? `<div class="cover-placeholder" id="cover-${artist.id}">
                  <span style="font-size:2rem;opacity:.4">&#128247;</span>
                  Upload your artist photo
                </div>`
              : `<div class="artist-card-cover" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;">No photo yet</div>`);

          return `
            <div class="artist-card" onclick="location.href='/artist.html?id=${artist.id}'">
              <div class="artist-card-img-wrap">
                ${coverHtml}
                ${uploadBtn}
              </div>
              <div class="artist-card-body">
                <div class="artist-card-name">${name}</div>
                ${bio ? `<div class="artist-card-bio">${bio}</div>` : ''}
                <span class="artist-card-works">${worksLabel}</span>
              </div>
            </div>`;
        }).join('');
      } catch (err) {
        grid.innerHTML = '<div class="empty-state">Error loading artists</div>';
      }
    }

    async function uploadPhoto(input, artistId) {
      const file = input.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('photo', file);
      try {
        const r = await api('/auth/me/photo', { method: 'POST', body: fd });
        const el = document.getElementById('cover-' + artistId);
        if (el && el.tagName === 'IMG') {
          el.src = r.profile_image + '?t=' + Date.now();
        } else if (el) {
          el.outerHTML = `<img class="artist-card-cover" id="cover-${artistId}" src="${r.profile_image}?t=${Date.now()}" alt="" loading="lazy">`;
        }
      } catch (err) {
        alert(err.message);
      }
    }

    loadArtists();
  </script>
</body>
</html>
