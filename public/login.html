<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Artistry</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <a href="/" class="nav-brand">Artistry</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <div class="form-card">
    <h2>Welcome Back</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <div id="error" class="form-error"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem">Log In</button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:.88rem;color:var(--muted)">
      Don't have an account? <a href="/register.html">Sign up</a>
    </p>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = Object.fromEntries(fd);
      try {
        const data = await api('/auth/login', { method: 'POST', body: JSON.stringify(body) });
        window.location.href = data.user.role === 'artist' ? '/dashboard.html' : '/';
      } catch (err) {
        document.getElementById('error').textContent = err.message;
      }
    });
  </script>
</body>
</html>
