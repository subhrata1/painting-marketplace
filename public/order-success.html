<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — The Brush Collective</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <a href="/" class="nav-brand">The Brush Collective</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <div style="max-width:500px;margin:4rem auto;text-align:center;padding:2rem;">
    <div style="font-size:3rem;margin-bottom:1rem;">&#10003;</div>
    <h1 style="font-size:1.5rem;font-weight:400;margin-bottom:.75rem;">Purchase Complete!</h1>
    <p style="color:var(--muted);margin-bottom:1.5rem;">
      Thank you for your order. The artist will ship the painting directly to you.
      You'll receive shipping updates via email.
    </p>
    <a href="/" class="btn btn-primary">Browse More Paintings</a>
  </div>

  <script src="/js/app.js"></script>
  <script>
    // Fire the Meta Pixel Purchase conversion. Value + currency are passed from
    // the Stripe success_url so Meta can optimise/report on real order value.
    (function () {
      var qp = new URLSearchParams(location.search);
      var value = parseFloat(qp.get('value'));
      var currency = qp.get('currency') || 'USD';
      function firePurchase() {
        if (!window.fbq) return;
        var payload = { currency: currency };
        if (!isNaN(value)) payload.value = value;
        fbq('track', 'Purchase', payload);
      }
      // app.js defines fbq synchronously, but guard in case it's still loading.
      if (window.fbq) firePurchase();
      else window.addEventListener('load', firePurchase);
    })();
  </script>
</body>
</html>
